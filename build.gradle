plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }

    // Team Reborn Energy
    maven { url = 'https://modmaven.dev' }

    // ModMenu
    maven { url = 'https://maven.terraformersmc.com/releases/' }

    // Cloth Config
    maven { url = 'https://maven.architectury.dev/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Energy API (for 1.20.1 use 3.x)
    include(modApi("teamreborn:energy:${project.tr_energy_version}"))

    // Optional dev conveniences
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    modRuntimeOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    //modCompileOnly "mezz.jei:jei-1.20.1-fabric:15.2.0.27"
    //modRuntimeOnly  "mezz.jei:jei-1.20.1-fabric:15.2.0.27"
}

loom {
    // If you add an access widener later:
    // accessWidenerPath = file("src/main/resources/industrial_legacy.accesswidener")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
