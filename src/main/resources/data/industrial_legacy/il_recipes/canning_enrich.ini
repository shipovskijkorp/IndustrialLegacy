; Industrial Legacy canning enrich-liquid recipes
; IC2 Exp 1.12.2 TileEntityCanner.init() enrich recipes translated to Industrial Legacy ids.
; Format: Fluid:<input fluid id>*<mb> + <additive>[*amount] = Fluid:<output fluid id>*<mb>
; The canner uses 200 ticks by default, matching TileEntityCanner's base operation length.

Fluid:minecraft:water*1000 + industrial_legacy:cf_powder = Fluid:industrial_legacy:construction_foam*1000
Fluid:minecraft:water*1000 + industrial_legacy:lapis_dust*8 = Fluid:industrial_legacy:coolant*1000
Fluid:industrial_legacy:distilled_water*1000 + industrial_legacy:lapis_dust = Fluid:industrial_legacy:coolant*1000
Fluid:minecraft:water*1000 + industrial_legacy:bio_chaff = Fluid:industrial_legacy:biomass*1000
Fluid:minecraft:water*6000 + minecraft:stick = Fluid:industrial_legacy:hot_water*1000
