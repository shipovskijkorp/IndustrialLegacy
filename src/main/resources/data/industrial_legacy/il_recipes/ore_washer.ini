; Industrial Legacy ore washing recipes
; IL Exp 1.12.2 2.8.222 ore_washer.ini translated to Industrial Legacy / Minecraft 1.20.1 ids.
; Format: <input>[*amount] = <output 1>[*amount] [<output n>[*amount]...] @fluid:<water mB>
; The machine uses 500 ticks by default, matching the current ore washing processing length.

industrial_legacy:silver_crushed_ore = industrial_legacy:silver_purified_crushed_ore industrial_legacy:small_silver_dust*2 industrial_legacy:stone_dust @fluid:1000
industrial_legacy:crushed_iron_ore = industrial_legacy:iron_purified_crushed_ore industrial_legacy:small_iron_dust*2 industrial_legacy:stone_dust @fluid:1000
industrial_legacy:crushed_tin_ore = industrial_legacy:tin_purified_crushed_ore industrial_legacy:small_tin_dust*2 industrial_legacy:stone_dust @fluid:1000
industrial_legacy:crushed_uranium_ore = industrial_legacy:purified_uranium_ore industrial_legacy:small_lead_dust*2 industrial_legacy:stone_dust @fluid:1000
industrial_legacy:crushed_copper_ore = industrial_legacy:copper_purified_crushed_ore industrial_legacy:small_copper_dust*2 industrial_legacy:stone_dust @fluid:1000
industrial_legacy:crushed_lead_ore = industrial_legacy:lead_purified_crushed_ore industrial_legacy:small_sulfur_dust*3 industrial_legacy:stone_dust @fluid:1000
industrial_legacy:crushed_gold_ore = industrial_legacy:gold_purified_crushed_ore industrial_legacy:small_gold_dust*2 industrial_legacy:stone_dust @fluid:1000
minecraft:gravel = industrial_legacy:stone_dust @fluid:1000
