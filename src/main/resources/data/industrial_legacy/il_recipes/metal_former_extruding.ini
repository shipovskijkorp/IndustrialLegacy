; Industrial Legacy metal former extruding recipes
; IL Exp 1.12.2 metal_former_extruding.ini translated to Industrial Legacy / Minecraft 1.20.1 ids.
; Format: <input>[*amount] = <output>[*amount]
; IL cable extension: Cable:<kind>:<insulation>

; --- IL source recipes, ids translated to IL ---
industrial_legacy:tin_casing = industrial_legacy:tin_can
industrial_legacy:tin_ingot = Cable:tin:0*3
minecraft:gold_ingot = Cable:gold:0*4
industrial_legacy:steel_block = industrial_legacy:steel_rod
minecraft:copper_ingot = Cable:copper:0*3
minecraft:iron_block = industrial_legacy:iron_rod
industrial_legacy:iron_plate = industrial_legacy:fuel_rod
industrial_legacy:iron_casing = industrial_legacy:iron_fence
minecraft:iron_ingot = Cable:iron:0*4

; --- Industrial Legacy additions ---
; These keep existing IL content that has no direct IL 1.12.2 config line.
industrial_legacy:bronze_plate*2 = industrial_legacy:bronze_rod
industrial_legacy:iron_plate*2 = industrial_legacy:iron_rod
industrial_legacy:steel_plate*2 = industrial_legacy:steel_rod
industrial_legacy:steel_ingot*9 = industrial_legacy:steel_rod
