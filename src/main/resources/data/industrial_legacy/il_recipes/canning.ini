; Industrial Legacy canning recipes
; IC2 Exp 1.12.2 TileEntityCanner.init() bottle recipes translated to editable .ini.
; Format: <container>[*amount] + <fill>[*amount] = <output>[*amount]
; The canner uses 200 ticks by default, matching TileEntityCanner's base operation length.

; --- Reactor fuel rods ---
industrial_legacy:fuel_rod + industrial_legacy:uranium = industrial_legacy:uranium_fuel_rod
industrial_legacy:fuel_rod + industrial_legacy:mox = industrial_legacy:mox_fuel_rod

; --- Food canning ---
industrial_legacy:tin_can + minecraft:potato = industrial_legacy:filled_tin_can
industrial_legacy:tin_can*2 + minecraft:cookie = industrial_legacy:filled_tin_can*2
industrial_legacy:tin_can*2 + minecraft:melon_slice = industrial_legacy:filled_tin_can*2
industrial_legacy:tin_can*2 + minecraft:cod = industrial_legacy:filled_tin_can*2
industrial_legacy:tin_can*2 + minecraft:chicken = industrial_legacy:filled_tin_can*2
industrial_legacy:tin_can*3 + minecraft:porkchop = industrial_legacy:filled_tin_can*3
