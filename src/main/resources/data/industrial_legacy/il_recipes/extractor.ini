; Industrial Legacy extractor recipes
; IC2 Exp 1.12.2 2.8.222 extractor.ini translated to Industrial Legacy / Minecraft 1.20.1 ids.
; Format: <input>[*amount] = <output>[*amount]
; IL extensions used here: Group:<name>, FluidCell:<fluid id>.

; Water Cell recipe is intentionally omitted: IC2 still marks it TODO in extractor.ini.

minecraft:nether_bricks = minecraft:nether_brick*4
minecraft:gunpowder = industrial_legacy:sulfur
minecraft:snow_block = minecraft:snowball*4
industrial_legacy:rubber_sapling = industrial_legacy:rubber
industrial_legacy:sticky_resin = industrial_legacy:rubber*3
industrial_legacy:filled_tin_can = industrial_legacy:tin_can
FluidCell:industrial_legacy:air = FluidCell:empty
minecraft:bricks = minecraft:brick*4
minecraft:clay = minecraft:clay_ball*4
industrial_legacy:rubber_log = industrial_legacy:rubber
Group:colored_wool = minecraft:white_wool
industrial_legacy:tin_hydrated_dust = industrial_legacy:iodine
industrial_legacy:netherrack_dust = industrial_legacy:small_sulfur_dust
industrial_legacy:bobs_yer_uncle_ranks_berry = industrial_legacy:small_emerald_dust
